<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Privacy policy of Mosaic, the class placement app for phones and tablets. Rosters stay on the device." />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <title>Privacy policy — Mosaic</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; background: #f6f7fb; color: #1e2235; font: 16px/1.7 system-ui, -apple-system, "Segoe UI", "Noto Sans JP", "Noto Sans KR", "Hiragino Sans", "Malgun Gothic", sans-serif; }
      main { max-width: 760px; margin: 0 auto; padding: 24px 18px 56px; }
      .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; color: #4f46e5; text-decoration: none; }
      .brand img { width: 28px; height: 28px; border-radius: 7px; }
      .langs { display: flex; flex-wrap: wrap; gap: 6px; margin: 18px 0 8px; }
      .langs a { padding: 4px 12px; border: 1px solid #d7dbe8; border-radius: 999px; background: #fff; color: #3b3f55; text-decoration: none; font-size: 14px; }
      .langs a[aria-current='true'] { background: #4f46e5; border-color: #4f46e5; color: #fff; }
      h1 { font-size: 28px; line-height: 1.3; margin: 24px 0 4px; }
      h2 { font-size: 19px; margin: 28px 0 6px; }
      p { margin: 8px 0; }
      .meta { color: #6b7088; font-size: 14px; margin-top: 0; }
      .scope { background: #fff; border: 1px solid #e3e6f0; border-radius: 12px; padding: 12px 14px; }
      a { color: #4338ca; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="../"><img src="../favicon.svg" alt="" />Mosaic</a>
      <!--PRIVACY_CONTENT-->
    </main>
    <script type="module" src="/src/privacy/main.ts"></script>
  </body>
</html>
